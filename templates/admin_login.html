{% extends "layout.html" %}
{% block title %}Admin – Prihlásenie{% endblock %}
{% block content %}
<div class="container" style="max-width:420px;margin-top:10vh">
  <div class="card shadow-sm border-0 rounded-4">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="bi bi-shield-lock" style="font-size:2.5rem;color:#6c757d"></i>
        <h4 class="mt-2 mb-0">Admin prístup</h4>
        <p class="text-muted small mt-1 mb-0">Zadajte admin heslo pre pokračovanie</p>
      </div>
      {% if error %}
      <div class="alert alert-danger py-2 small">{{ error }}</div>
      {% endif %}
      <form method="post" autocomplete="off">
        <div class="mb-3">
          <input type="password" name="password" class="form-control form-control-lg" placeholder="Heslo…" autofocus required>
        </div>
        <button type="submit" class="btn btn-dark w-100 rounded-pill">
          <i class="bi bi-box-arrow-in-right me-2"></i>Prihlásiť sa
        </button>
      </form>
      <div class="text-center mt-3">
        <a href="{{ url_for('index') }}" class="text-muted small">← Späť na spevník</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
