<!-- Status Filter Section -->
<div class="card border-0 shadow-sm rounded-4" style="background: linear-gradient(135deg, #fff8f0 0%, #ffffff 100%);">
  <div class="card-body p-3">
    <div class="d-flex align-items-center justify-content-between">
      <h6 class="mb-0 fw-bold text-dark">
        <i class="bi bi-funnel-fill text-warning me-2"></i>
        Status filtre
      </h6>
      <div class="status-buttons d-flex gap-2" id="statusFilters">
        <button class="status-filter-btn btn btn-sm rounded-pill"
                data-status="unchecked"
                title="Zobraziť len neskontrolované piesne">
          <i class="bi bi-exclamation-triangle-fill me-1"></i>
          Neskontrolované
          <span class="status-count badge bg-light text-dark ms-1" id="uncheckedCount">{{ total_songs - total_admin_checked }}</span>
        </button>

        <button class="status-filter-btn btn btn-sm rounded-pill"
                data-status="unprinted"
                title="Zobraziť len nevytlačené piesne">
          <i class="bi bi-printer me-1"></i>
          Nevytlačené
          <span class="status-count badge bg-light text-dark ms-1" id="unprintedCount">{{ total_songs - total_printed }}</span>
        </button>
      </div>
      <button id="clearStatusFilters" class="btn btn-outline-secondary btn-sm rounded-pill" style="display: none;">
        <i class="bi bi-x-circle me-1"></i>
        Vyčistiť
      </button>
    </div>
  </div>
</div>
